<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOR Dashboard | DC7171 Lamphun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root{
    --bg:#f2f4f8;
    --panel:#ffffff;
    --panel-alt:#f6f8fb;
    --line:#e5eaf1;
    --text:#0f1b2d;
    --text-dim:#5b6b82;
    --text-faint:#94a3b8;
    --blue:#0056a4;
    --blue-dim:#e7f0fa;
    --red:#e4002b;
    --amber:#e8a13c;
    --green:#00a651;
    --teal:#3fa9b4;
    --radius:14px;
    --shadow:0 2px 8px rgba(15,27,45,0.05), 0 1px 2px rgba(15,27,45,0.04);
    --sidebar-w:236px;
    --topbar-h:76px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'IBM Plex Sans Thai',sans-serif;height:100%;overflow:hidden;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#d7dee7;border-radius:8px;}

  .app{display:flex;height:100vh;width:100vw;}

  /* ===== Sidebar ===== */
  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;background:#fff;border-right:1px solid var(--line);
    display:flex;flex-direction:column;
  }
  .sidebar-brand{padding:20px 18px;border-bottom:1px solid var(--line);}
  .brand-logo{height:30px;width:auto;display:block;margin-bottom:10px;}
  .brand-title{font-family:'Space Grotesk';font-size:14.5px;font-weight:600;line-height:1.3;}
  .brand-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .nav-list{list-style:none;margin:0;padding:14px 10px;flex:1;overflow-y:auto;}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;
    cursor:pointer;margin-bottom:4px;border-left:3px solid transparent;color:var(--text-dim);
    transition:all .15s ease;
  }
  .nav-item:hover{background:var(--panel-alt);}
  .nav-item.active{background:var(--blue-dim);border-left-color:var(--blue);color:var(--text);}
  .nav-icon{
    width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .nav-icon svg{width:17px;height:17px;}
  .nav-label{font-size:13.5px;font-weight:500;}
  .nav-num{font-family:'IBM Plex Mono';font-size:10px;color:var(--text-faint);margin-left:auto;}
  .sidebar-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--text-faint);}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;
    box-shadow:0 0 0 0 rgba(0,166,81,0.5);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,166,81,0.5);}70%{box-shadow:0 0 0 6px rgba(0,166,81,0);}100%{box-shadow:0 0 0 0 rgba(0,166,81,0);}}

  /* ===== Main content ===== */
  .content{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{
    height:var(--topbar-h);flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:16px;
  }
  .topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
  .topic-num-badge{
    width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;color:#fff;font-size:14px;flex-shrink:0;
  }
  .topbar-titles h2{font-family:'Space Grotesk';font-size:19px;margin:0;}
  .topbar-titles p{font-size:12.5px;color:var(--text-dim);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  select{
    background:var(--panel-alt);border:1px solid var(--line);color:var(--text);
    padding:8px 12px;border-radius:8px;font-family:'IBM Plex Sans Thai';font-size:13px;cursor:pointer;
  }
  .nav-arrow{
    width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel-alt);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);
  }
  .nav-arrow:hover{border-color:var(--blue);color:var(--blue);}
  .status-pill{
    display:flex;align-items:center;gap:7px;font-size:12px;padding:7px 13px;border-radius:20px;
    background:var(--panel-alt);border:1px solid var(--line);white-space:nowrap;
  }
  .status-light{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .status-green{background:var(--green);box-shadow:0 0 6px var(--green);}
  .status-amber{background:var(--amber);box-shadow:0 0 6px var(--amber);}
  .status-red{background:var(--red);box-shadow:0 0 6px var(--red);}

  .dash-area{flex:1;overflow-y:auto;padding:22px 26px 30px;}
  .dash-grid{display:flex;flex-direction:column;gap:16px;max-width:1440px;margin:0 auto;}

  .kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
  .kpi-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 18px;
  }
  .kpi-card-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
  .kpi-card-value{font-family:'Space Grotesk';font-size:24px;font-weight:700;}
  .kpi-card-mom{font-family:'IBM Plex Mono';font-size:12px;margin-top:8px;display:flex;align-items:center;gap:5px;}
  .up{color:var(--green);} .down{color:var(--red);} .flat{color:var(--text-dim);}

  .chart-row{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  @media(max-width:1100px){.chart-row{grid-template-columns:1fr;}}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px 20px;
  }
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .panel-title{font-size:12.5px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;}
  .panel-tag{font-size:10.5px;color:var(--text-faint);background:var(--panel-alt);padding:4px 9px;border-radius:12px;}
  canvas{max-width:100%;}
  .chart-container{position:relative;height:300px;width:100%;}

  .bottom-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start;}
  .donut-wrap{display:flex;align-items:center;gap:18px;}
  .donut-canvas-box{width:120px;height:120px;flex-shrink:0;position:relative;}
  .donut-legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px;}
  .donut-legend-item{display:flex;align-items:center;gap:8px;}
  .donut-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .donut-legend-label{color:var(--text-dim);}
  .donut-legend-value{font-family:'IBM Plex Mono';font-weight:600;margin-left:auto;padding-left:10px;}
  .breakdown-table{width:100%;border-collapse:collapse;font-size:13px;}
  .breakdown-table th{text-align:left;color:var(--text-faint);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;}
  .breakdown-table td{padding:9px 6px;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono';}
  .breakdown-table tr:last-child td{border-bottom:none;}

  @media(max-width:760px){
    html,body{overflow:auto;}
    .app{height:auto;flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;}
    .nav-list{display:flex;padding:10px;}
    .nav-item{flex-shrink:0;}
    .dash-area{overflow:visible;}
  }
</style>
</head>

const fmtLabel = (v) => { const n = Number(v); return (v === null || v === undefined || v === '' || n === 0 || isNaN(n)) ? '' : Math.round(n).toLocaleString('en-US'); };
const fmtMillions = (v) => { const n = Number(v); return (v === null || v === undefined || v === '' || n === 0 || isNaN(n)) ? '' : (n / 1000000).toFixed(2) + 'M'; };
const fmtPercent2 = (v) => { const n = Number(v); return (v === null || v === undefined || v === '' || isNaN(n)) ? '' : n.toFixed(3) + '%'; };
// เลือกฟังก์ชันแปลงตัวเลขให้เหมาะกับหน่วยของแต่ละหมวด (case หลักล้าน / case ปกติ / เปอร์เซ็นต์)
const fmtByUnit = (unit, v) => unit === 'percent' ? fmtPercent2(v) : unit === 'millions' ? fmtMillions(v) : fmtLabel(v);

// ทำลาย Chart ที่ผูกกับ canvas นี้อยู่จริง (ถาม Chart.js ตรงๆ แทนที่จะเชื่อแค่ตัวแปรที่เราเก็บเอง)
// กันปัญหา "Canvas is already in use" ตอนที่ render รอบก่อนหน้าพังกลางคันแล้วตัวแปร state.charts.* ไม่ตรงกับของจริง
function destroyChartOn(canvasEl){
  const existing = Chart.getChart(canvasEl);
  if(existing) existing.destroy();
}

function fetchJSONP(url, onData, onError){
  const cbName = 'jsonp_cb_' + Math.random().toString(36).slice(2);
  const script = document.createElement('script');
  const cleanup = () => { delete window[cbName]; script.remove(); };
  window[cbName] = (data) => { cleanup(); onData(data); };
  script.onerror = () => { cleanup(); if(onError) onError(); };
  script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
  document.body.appendChild(script);
}

const num = (n) => n === null || n === undefined || n === '' || isNaN(n) ? 0 : Number(n);
const EN_MONTHS = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const monthLabelOf = (m) => EN_MONTHS[m.Month] || m.MonthLabel;
const isWeekend = (dateStr) => {
  const parts = String(dateStr).split('-').map(Number);
  if (parts.length < 3) return false;
  const day = new Date(parts[0], parts[1] - 1, parts[2]).getDay();
  return day === 0 || day === 6; // Sun=0, Sat=6
};
const fmt = (n) => n === null || n === undefined || isNaN(n) ? '—' : Math.round(n).toLocaleString('en-US');
const fmtPct = (v) => { const n = Number(v); return (v === null || v === undefined || v === '' || isNaN(n)) ? '—' : n.toFixed(3) + '%'; };
const gridColor = 'rgba(15,27,45,0.07)';
const tickColor = '#5b6b82';

function momArrow(curr, prev, suffix='MoM'){
  if(prev === null || prev === undefined || prev === 0 || curr === null || curr === undefined) return {cls:'flat', txt:'—'};
  const pct = ((curr - prev) / Math.abs(prev)) * 100;
  const arrow = pct > 0.5 ? '▲' : pct < -0.5 ? '▼' : '●';
  const cls = pct > 0.5 ? 'up' : pct < -0.5 ? 'down' : 'flat';
  return {cls, txt: `${arrow} ${Math.abs(pct).toFixed(1)}% ${suffix}`};
}

function statusFor(section, cur){
  if(section.target === null) return {cls:'status-green', txt:'อยู่ในเกณฑ์'};
  const v = section.momValue(cur);
  if(v <= section.target) return {cls:'status-green', txt:'อยู่ในเกณฑ์'};
  if(v <= section.target * 2.5) return {cls:'status-amber', txt:'ใกล้เกณฑ์ ต้องติดตาม'};
  return {cls:'status-red', txt:'หลุดเกณฑ์'};
}

function buildSidebar(){
  const navList = document.getElementById('navList');
  navList.innerHTML = SECTIONS.map((s,i) => `
    <li class="nav-item" data-idx="${i}">
      <div class="nav-icon" style="background:${s.color}1a;color:${s.color}">${ICONS[s.key]}</div>
      <div class="nav-label">${s.title}</div>
      <div class="nav-num">${String(i+1).padStart(2,'0')}</div>
    </li>`).join('');
  navList.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => { state.activeTopic = +el.dataset.idx; renderAll(); });
  });
}

function dailyForSelectedMonth(){
  const cur = state.monthly[state.selectedIdx];
  const ym = `${cur.Year}-${String(cur.Month).padStart(2,'0')}`;
  return state.daily.filter(d => d.Date.startsWith(ym));
}

function buildMonthSelect(){
  const sel = document.getElementById('monthSelect');
  sel.innerHTML = state.monthly.map((m,i) =>
    `<option value="${i}">${monthLabelOf(m)} ${m.Year}</option>`).join('');
  sel.selectedIndex = state.selectedIdx;
  sel.addEventListener('change', () => { state.selectedIdx = +sel.value; renderAll(); });
}

function renderAll(){
  try {
    renderAllInner();
  } catch (err) {
    console.error('renderAll error:', err);
    const s = SECTIONS[state.activeTopic];
    document.getElementById('kpiStrip').innerHTML = `<div class="kpi-card" style="border-left:3px solid var(--red);">
      <div class="kpi-card-label">เกิดข้อผิดพลาด</div>
      <div style="font-size:12.5px;color:var(--text-dim);margin-top:6px;line-height:1.6;">
        โหลดหมวด "${s ? s.title : ''}" ไม่สำเร็จ<br>
        <span class="mono" style="color:var(--red);">${(err && err.message) || err}</span><br>
        เปิด Console (F12) เพื่อดูรายละเอียดเพิ่มเติม
      </div>
    </div>`;
  }
}

function renderAllInner(){
  const s = SECTIONS[state.activeTopic];
  const cur = state.monthly[state.selectedIdx];
  const prev = state.monthly[state.selectedIdx - 1] || null;
  const days = dailyForSelectedMonth();
  // ตัดกราฟ Trend ให้แสดงถึงแค่ "เดือนที่เลือกไว้" (เดือนที่กำลังประชุม) เท่านั้น
  // แม้ต้นทางจะเริ่มมีข้อมูลของเดือนถัดไปโผล่มาบางส่วนแล้วก็ไม่โชว์ ป้องกันแท่ง/จุดครึ่งเดือนที่ทำให้เข้าใจผิด
  const visibleMonths = state.monthly.slice(0, state.selectedIdx + 1);
  const monthLabels = visibleMonths.map(m => monthLabelOf(m));
  const yearsPresent = [...new Set(state.monthly.map(m => m.Year))].sort((a,b) => a-b);
  const isMultiYear = yearsPresent.length > 1;
  const YEAR_PALETTE = ['#c9d3de', '#94a3b8', '#5b6b82']; // เดือนของปีเก่าสุดไปใหม่สุด ไล่จากอ่อนไปเข้ม (ปีปัจจุบันใช้สีของหมวดเอง)
  const dayLabels = days.map(d => d.Date.slice(-2));

  // sidebar active state
  document.querySelectorAll('.nav-item').forEach((el,i) => el.classList.toggle('active', i === state.activeTopic));

  // topbar
  document.getElementById('topicBadge').style.background = s.color;
  document.getElementById('topicBadge').textContent = String(state.activeTopic+1).padStart(2,'0');
  document.getElementById('topicTitle').textContent = s.title;
  document.getElementById('topicDesc').textContent = s.desc;
  const st = statusFor(s, cur);
  document.getElementById('statusPill').innerHTML = `<span class="status-light ${st.cls}"></span><span>${st.txt}</span>`;

  // kpi strip
  const arrow = momArrow(s.momValue(cur), prev ? s.momValue(prev) : null);

  // YoY: เทียบเดือนเดียวกันกับปีก่อน (ถ้ามีข้อมูลปีก่อนของเดือนนั้น)
  const yoyRow = state.monthly.find(m => m.Year === cur.Year - 1 && m.Month === cur.Month);
  const yoyArrow = momArrow(s.momValue(cur), yoyRow ? s.momValue(yoyRow) : null, 'YoY');
  const yoyCard = `<div class="kpi-card"><div class="kpi-card-label">เทียบปีก่อน (YoY)</div><div class="kpi-card-mom ${yoyArrow.cls}">${yoyArrow.txt}</div></div>`;

  // YTD: ยอดสะสมตั้งแต่ต้นปีถึงเดือนที่เลือก (ใช้ยอดเคสสะสม ไม่ใช่ % เพราะบวกเปอร์เซ็นต์รวมกันไม่ได้)
  let ytdCard = '';
  if(!s.noYTD){
    const ytdFn = s.comboChart ? s.comboChart.bar.data : s.trend.data;
    const ytdUnit = s.unit === 'percent' ? 'case' : s.unit;
    const sumYTD = (year) => state.monthly
      .filter(m => m.Year === year && m.Month <= cur.Month)
      .reduce((sum, m) => sum + (Number(ytdFn(m)) || 0), 0);
    const ytdCurrent = sumYTD(cur.Year);
    const hasPrevYearData = state.monthly.some(m => m.Year === cur.Year - 1);
    const ytdArrow = hasPrevYearData ? momArrow(ytdCurrent, sumYTD(cur.Year - 1), 'YoY') : {cls:'flat', txt:'—'};
    ytdCard = `<div class="kpi-card"><div class="kpi-card-label">YTD (ม.ค.–${monthLabelOf(cur)})</div><div class="kpi-card-value">${fmtByUnit(ytdUnit, ytdCurrent) || fmtLabel(ytdCurrent)}</div><div class="kpi-card-mom ${ytdArrow.cls}">${ytdArrow.txt}</div></div>`;

  if(s.comboChart){

    state.charts.trend = new Chart(trendCtx, {
      data:{
        labels: comboLabels,

          {

          },

            data: visibleMonths.map(s.comboChart.line.data),
            borderColor: s.comboChart.line.color, backgroundColor: s.comboChart.line.color,
            yAxisID:'y1', tension:.3, pointRadius:3, pointBackgroundColor:'#fff', pointBorderColor: s.comboChart.line.color, pointBorderWidth:2, fill:false, borderWidth:2.5,
            datalabels:{ display:true, align:'top', offset:6, clamp:true, color: s.comboChart.line.color, font:{size:8, family:'IBM Plex Mono', weight:'600'}, formatter:fmtPercent2 }
          }
        ]
      },
      options:{ responsive:true, maintainAspectRatio:false,
        layout:{ padding:{ top:22 } },
        interaction:{ intersect:false, mode:'index' },
        plugins:{ legend:{ position:'bottom', labels:{ color:tickColor, font:{family:'IBM Plex Sans Thai', size:11}, boxWidth:10, padding:12 } } },
        scales:{
          x:{ ticks:{color:tickColor}, grid:{display:false} },

        }

  } else if(isMultiYear){
    // มีมากกว่า 1 ปี -> เทียบเดือนชนเดือนข้ามปี (YoY) แทนเส้น/แท่งต่อเนื่องยาว
    const monthNums = Array.from({length:12}, (_, i) => i + 1);
    const curYear = cur.Year, curMonthNum = cur.Month;
    const yoyDatasets = yearsPresent.map((yr, i) => {
      const isCurrentYear = (i === yearsPresent.length - 1);
      const color = isCurrentYear ? s.trend.color : YEAR_PALETTE[Math.max(0, YEAR_PALETTE.length - (yearsPresent.length - i))];
      return {
        label: String(yr),
        data: monthNums.map(mn => {
          if (yr === curYear && mn > curMonthNum) return null; // ไม่โชว์เดือนที่ยังไม่ถึง/ยังไม่ครบของปีปัจจุบัน
          const row = state.monthly.find(m => m.Year === yr && m.Month === mn);
          return row ? s.trend.data(row) : null;
        }),
        backgroundColor: color, borderRadius:3, maxBarThickness:26,
        datalabels: { display: isCurrentYear }
      };
    });
    state.charts.trend = new Chart(trendCtx, {
      type:'bar',
      data:{ labels: monthNums.map(mn => EN_MONTHS[mn]), datasets: yoyDatasets },
      options:{ responsive:true, maintainAspectRatio:false,
        interaction:{ intersect:false, mode:'index' },
        plugins:{
          legend:{ position:'bottom', labels:{ color:tickColor, font:{family:'IBM Plex Sans Thai', size:11}, boxWidth:10, padding:12 } },
          datalabels:{ display:true, anchor:'end', align:'top', color:tickColor, font:{size:10, family:'IBM Plex Mono'}, formatter:(v) => fmtByUnit(s.unit, v) }
        },
        scales:{ x:{ ticks:{color:tickColor}, grid:{display:false} }, y:{ ticks:{color:tickColor}, grid:{color:gridColor}, beginAtZero:true } }
      }
    });
  } else if(s.trendSeries){
    state.charts.trend = new Chart(trendCtx, {
      type:'bar',
      data:{ labels: monthLabels, datasets: s.trendSeries.map(ts => ({
        label: ts.label, data: visibleMonths.map(ts.data),
        backgroundColor: ts.color, borderRadius:3, maxBarThickness:34
      }))},
      options:{ responsive:true, maintainAspectRatio:false,
        interaction:{ intersect:false, mode:'index' },
        plugins:{ legend:{ position:'bottom', labels:{ color:tickColor, font:{family:'IBM Plex Sans Thai', size:11}, boxWidth:10, padding:12 } } },
        scales:{
          x:{ stacked:true, ticks:{color:tickColor}, grid:{display:false} },
          y:{ stacked:true, ticks:{color:tickColor}, grid:{color:gridColor}, beginAtZero:true }
        }
      }
    });
  } else {
    state.charts.trend = new Chart(trendCtx, {
      type:'line',
      data:{ labels: monthLabels, datasets:[{
        label: s.trend.label, data: visibleMonths.map(s.trend.data),
        borderColor: s.trend.color, backgroundColor: s.trend.color+'1a', borderWidth:2.5,
        cubicInterpolationMode:'monotone', fill:true, pointRadius:4, pointBackgroundColor:'#fff',
        pointBorderColor: s.trend.color, pointBorderWidth:2, pointHoverRadius:6
      }]},
      options:{ responsive:true, maintainAspectRatio:false,
        interaction:{ intersect:false, mode:'index' },
        plugins:{
          legend:{ display:false },
          datalabels:{ display:true, align:'top', offset:8, color:tickColor, font:{size:10, family:'IBM Plex Mono'}, formatter:(v) => fmtByUnit(s.unit, v) }
        },
        scales:{ x:{ ticks:{color:tickColor}, grid:{display:false} }, y:{ ticks:{color:tickColor}, grid:{color:gridColor}, beginAtZero:true } }
      }
    });
  }

  // daily chart — stacked breakdown if available, otherwise single series
  document.getElementById('dailyTag').textContent = `${monthLabelOf(cur)} ${cur.Year}`;
  const dailyCtx = document.getElementById('dailyChart');
  destroyChartOn(dailyCtx);

  if(s.dailySeries){
    const totalsPerDay = days.map(d => s.dailySeries.reduce((sum, ds) => sum + num(ds.data(d)), 0));
    state.charts.daily = new Chart(dailyCtx, {
      type:'bar',
      data:{ labels: dayLabels, datasets: s.dailySeries.map((ds, idx) => ({
        label: ds.label, data: days.map(ds.data),
        backgroundColor: days.map(d => isWeekend(d.Date) ? ds.color + '4d' : ds.color),
        borderRadius:2, maxBarThickness:22,
        // โชว์ตัวเลข "รวมทั้งแท่ง" แค่ครั้งเดียวที่ชั้นบนสุดของแท่งซ้อน กันเลขซ้ำ/ทับกันทุกชั้นสี
        datalabels: idx === s.dailySeries.length - 1
          ? { display:true, anchor:'end', align:'top', rotation:-90, offset:4,
              color:tickColor, font:{size:8, family:'IBM Plex Mono'},
              formatter:(v, ctx) => fmtLabel(totalsPerDay[ctx.dataIndex]) }
          : { display:false }
      }))},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ color:tickColor, font:{family:'IBM Plex Sans Thai', size:11}, boxWidth:10, padding:12 } } },
        scales:{
          x:{ stacked:true, ticks:{color:tickColor, autoSkip:false, maxRotation:0, minRotation:0, font:{size:10}}, grid:{display:false} },
          y:{ stacked:true, ticks:{color:tickColor}, grid:{color:gridColor}, beginAtZero:true }
        }
      }
    });
  } else {
    state.charts.daily = new Chart(dailyCtx, {
      type:'bar',
      data:{ labels: dayLabels, datasets:[{
        label: s.daily.label, data: days.map(s.daily.data),
        backgroundColor: days.map(d => isWeekend(d.Date) ? s.daily.color + '40' : s.daily.color + 'cc'),
        borderRadius:4, maxBarThickness:22
      }]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{ display:false },
          datalabels:{ display:true, anchor:'end', align:'top', rotation:-90, offset:4, color:tickColor, font:{size:8, family:'IBM Plex Mono'}, formatter:(v) => fmtByUnit(s.unit, v) }
        },
        scales:{
          x:{ ticks:{color:tickColor, autoSkip:false, maxRotation:0, minRotation:0, font:{size:10}}, grid:{display:false} },
          y:{ ticks:{color:tickColor}, grid:{color:gridColor}, beginAtZero:true }
        }
      }
    });
  }

  // breakdown + donut cards
  const breakdownRow = document.getElementById('breakdownRow');
  let cardsHtml = '';
  if(s.donut){
    cardsHtml += `<div class="panel">
      <div class="panel-head"><div class="panel-title">สัดส่วนตามแหล่งที่มา</div><div class="panel-tag">เดือนนี้</div></div>
      <div class="donut-wrap">
        <div class="donut-canvas-box"><canvas id="donutChart"></canvas></div>
        <div class="donut-legend" id="donutLegend"></div>
      </div>
    </div>`;
  }
  if(s.breakdown){
    cardsHtml += `<div class="panel">
      <div class="panel-head"><div class="panel-title">Breakdown เดือนนี้</div></div>
      <table class="breakdown-table"><thead><tr><th>รายละเอียด</th><th>ค่า</th></tr></thead><tbody>${
        s.breakdown(cur).map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')
      }</tbody></table>
    </div>`;
  }
  breakdownRow.innerHTML = cardsHtml;

  if(s.donut){
    const parts = s.donut(cur);
    const total = parts.reduce((a,p) => a + p.value, 0);
    if(total === 0){
      document.querySelector('.donut-wrap').outerHTML =
        `<div style="padding:24px 4px;color:var(--text-faint);font-size:12.5px;line-height:1.7;">
          ยังไม่มีข้อมูลแยกตามแหล่งที่มา<br>
          (ต้องเพิ่มคอลัมน์ Inbound_7151, Inbound_7174, Inbound_7176, Inbound_7177, Inbound_7178
          ต่อท้าย Sheet แล้วรัน aggregateFromSource อีกครั้ง)
        </div>`;
    } else {
      document.getElementById('donutLegend').innerHTML = parts.map(p => `
        <div class="donut-legend-item">
          <span class="donut-dot" style="background:${p.color}"></span>
          <span class="donut-legend-label">${p.label}</span>
          <span class="donut-legend-value">${(p.value/total*100).toFixed(1)}%</span>
        </div>`).join('');
      const donutCtx = document.getElementById('donutChart');
      destroyChartOn(donutCtx);
      state.charts.donut = new Chart(donutCtx, {
        type:'doughnut',
        data:{ labels: parts.map(p=>p.label), datasets:[{ data: parts.map(p=>p.value), backgroundColor: parts.map(p=>p.color), borderWidth:0 }] },
        options:{ responsive:true, maintainAspectRatio:false, cutout:'68%',
          plugins:{ legend:{ display:false }, tooltip:{ enabled:true } }
        }
      });
    }
  }
}

document.getElementById('prevBtn').addEventListener('click', () => {
  state.activeTopic = (state.activeTopic - 1 + SECTIONS.length) % SECTIONS.length;
  renderAll();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  state.activeTopic = (state.activeTopic + 1) % SECTIONS.length;
  renderAll();
});

function init(){
  fetchJSONP(API_URL + '?action=getMonthlySummary', (res) => {
    if(res.status !== 'ok'){ alert('โหลดข้อมูลรายเดือนไม่สำเร็จ: ' + res.message); return; }
    state.monthly = res.data;
    // ค่าเริ่มต้น: เลือก "เดือนก่อนหน้าเดือนล่าสุด" เป็นค่าเริ่มต้น
    // เพราะรอบประชุม MOR คุยผลของเดือนที่ผ่านมาแล้ว (เดือนล่าสุดในชีทมักเป็นเดือนปัจจุบันที่ข้อมูลยังไม่ครบ)
    // ยังเลือกเดือนอื่นเองผ่าน Dropdown ได้ตามต้องการ
    state.selectedIdx = Math.max(0, state.monthly.length - 2);
    buildSidebar();
    buildMonthSelect();
    fetchJSONP(API_URL + '?action=getDailyDetail', (res2) => {
      if(res2.status === 'ok') state.daily = res2.data;
      renderAll();
    });
  }, () => alert('เชื่อมต่อ API ไม่สำเร็จ'));
}

init();
</script>
</body>
</html>
